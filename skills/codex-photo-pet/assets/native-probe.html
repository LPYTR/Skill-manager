<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#20242b}#pet{position:absolute;left:20px;top:20px;width:192px;height:208px;background-repeat:no-repeat}</style><div id="pet"></div><script>
window.startProbe=async config=>{const image=new Image();image.src=config.src;await image.decode();const pet=document.getElementById('pet');pet.style.backgroundSize=`800% ${config.rows*100}%`;pet.style.backgroundImage=`url(${config.src})`;let column=0;function step(){pet.style.backgroundPosition=`${column/7*100}% ${3/(config.rows-1)*100}%`;window.nativeColumn=column;setTimeout(()=>{column=(column+1)%4;step()},config.durations[column])}step();await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);return performance.now()};
</script>
